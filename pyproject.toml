[project]
name = "capstone2-structures"
version = "0.1.0"
description = "Caltech CTME capstone 2 part 1: transfer-learning classifier for historical structure images (10 classes)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "ruff>=0.17.4",
    "tensorflow>=2.21.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
